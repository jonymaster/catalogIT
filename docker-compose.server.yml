# Production-oriented stack for a host behind Nginx Proxy Manager (or similar).
#
# Images (build and push before deploy):
#   docker build -t jonymaster/catalogit-api:1.0.0 ./backend
#   docker build -f frontend/Dockerfile.prod -t jonymaster/catalogit-ui:1.0.0 .
#
# Portainer: add the same variables in the stack Environment (Git deploy omits
# gitignored `.env`). Local `docker compose` still substitutes ${...} from a
# project `.env` if present.
#
# Copy `.env.example` to `.env` on the server (or set in Portainer) at least:
#   DATABASE_URL, JWT_SECRET, INTEGRATION_SECRET_KEY, SCIM_TOKEN,
#   FRONTEND_URL, PUBLIC_BASE_URL (your public https URLs),
#   MINIO_*, POSTGRES_*, CRON_SECRET, DB_PATH, MINIO_DATA_PATH (host dirs for volumes),
#   and turn off SEED_SAMPLE_DATA if desired.
#
# After first start: docker compose -f docker-compose.server.yml exec api alembic upgrade head
#
# NPM: one hostname with path routing — "/" -> ui:80, "/api", "/auth", "/scim", "/docs",
# "/openapi.json" -> api:8000 — so the browser keeps a single origin (matches frontend axios baseURL "/").
#
# UI keeps restarting? On the Portainer host run: docker logs <ui-container-name>
#   - "exec format error" — image CPU arch does not match the host (e.g. arm64 image on
#     amd64). Rebuild and push multi-arch or for your host: linux/amd64.
#   - Ensure catalogit-ui is built from frontend/Dockerfile.prod (nginx on :80). A dev
#     image (npm run dev, port 5173) does not match this compose file's ":80" mapping.
#
# API: "Could not import module app.main" — often the image runs as a non-root user but
# /app/app is root-only (mode 0750). Fix the API Dockerfile: after COPY, run
#   chown -R appuser:appuser /app   (or chmod -R a+rX /app)
# Temporary workaround: set user: "0:0" on the api service (see comment there).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-catalogit}
    volumes:
      - ${DB_PATH:?Set DB_PATH to the host directory for PostgreSQL data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalogit}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-catalogit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - ${MINIO_DATA_PATH:?Set MINIO_DATA_PATH to the host directory for MinIO object storage}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: jonymaster/catalogit-api:${CATALOGIT_TAG:-1.0.0}
    # If import fails for appuser, uncomment until the image is rebuilt with correct ownership:
    # user: "0:0"
    restart: unless-stopped
    ports:
      - "${API_PUBLISH:-8000}:8000"
    environment:
      # Same keys as Application section in `.env` (explicit list — works without env_file for Portainer Git stacks).
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY}
      SCIM_TOKEN: ${SCIM_TOKEN}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_EXTERNAL_ID: ${ADMIN_EXTERNAL_ID}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      CRON_SECRET: ${CRON_SECRET}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    # Image must serve static files on container port 80 (Dockerfile.prod), not Vite dev.
    image: jonymaster/catalogit-ui:${CATALOGIT_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${UI_PUBLISH:-8080}:80"
    depends_on:
      - api

  cron:
    image: alpine/curl:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "0 6 * * * curl -sf -X POST -H 'X-Cron-Secret: $${CRON_SECRET}' http://api:8000/api/internal/notifications/renewal-dispatch >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        crond -f -l 2
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      - api
