[project]
name = "catalogit-mcp"
version = "0.1.0"
description = "MCP server for the CatalogIT REST API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
catalogit-mcp = "catalogit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogit_mcp"]
