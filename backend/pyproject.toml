[project]
name = "catalogit-backend"
version = "1.1.1"
description = "CatalogIT API backend"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pyjwt[crypto]",
    "httpx",
    "python-multipart",
    "bcrypt",
    "aiobotocore",
    "cryptography",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
