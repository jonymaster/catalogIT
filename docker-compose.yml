services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalogit_local}
      POSTGRES_DB: ${POSTGRES_DB:-catalogit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalogit}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-catalogit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-catalogit_local}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./data:/data
    env_file:
      - .env
    environment:
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

  cron:
    image: alpine/curl:latest
    profiles: [cron]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "0 6 * * * curl -sf -X POST -H 'X-Cron-Secret: $${CRON_SECRET}' http://api:8000/api/internal/notifications/renewal-dispatch >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        crond -f -l 2
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
