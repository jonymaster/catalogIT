map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker embedded DNS — allows variable proxy_pass so `api` is not resolved at nginx -t.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API as the SPA (axios baseURL "/"). Without this, /auth and /api hit
    # try_files and never reach the FastAPI container — login appears to fail and the
    # API container logs stay empty. External reverse proxies (NPM) can still route
    # here on one hostname, or you can publish only the UI port and rely on Docker DNS.
    client_max_body_size 50m;

    location ^~ /api {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /auth {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /scim {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $catalogit_api http://api:8000;
        proxy_pass $catalogit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite emits fingerprinted JS/CSS/images under /assets/ — safe to cache forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
